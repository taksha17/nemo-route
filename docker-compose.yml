services:
  nemo-route:
    build: .
    image: nemo-route/server:local
    ports:
      - "${NEMO_PORT:-8788}:8788"
    environment:
      NEMO_HOST: "0.0.0.0"
      NEMO_PORT: "8788"
      NEMO_DATA_DIR: /data
      NEMO_EXPOSE_ADMIN: "${NEMO_EXPOSE_ADMIN:-1}"
      NIM_BASE_URL: "${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}"
      NIM_API_KEY: "${NIM_API_KEY:-}"
      NEMO_ENCRYPTION_SECRET: "${NEMO_ENCRYPTION_SECRET:-}"
      NEMO_ADMIN_TOKEN: "${NEMO_ADMIN_TOKEN:-}"
      NEMO_SKIP_BOOTSTRAP: "${NEMO_SKIP_BOOTSTRAP:-}"
    volumes:
      - nemo-data:/data
    restart: unless-stopped

volumes:
  nemo-data:
